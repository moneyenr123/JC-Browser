<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>JC Browser</title>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f2f2f2;
      --text: #000000;
      --accent: #0a84ff;
      --border: #ccc;
    }

    .dark {
      --bg: #000000;
      --surface: #111111;
      --text: #ffffff;
      --accent: #1f6bff;
      --border: #333333;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, Arial;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }

    /* Switch */
    .switch {
      position: relative;
      width: 60px;
      height: 28px;
      background: #555;
      border-radius: 20px;
      cursor: pointer;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: 0.25s;
    }

    .switch.active {
      background: var(--accent);
    }

    .switch.active::after {
      left: 34px;
    }

    /* Iframe container */
    #iframeContainer {
      flex: 1;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <div id="topbar">
    <span>Light Mode</span>
    <div id="themeSwitch" class="switch"></div>
    <span>Dark Mode</span>
  </div>

  <div id="iframeContainer">
    <iframe src="https://endis.rest" allowfullscreen></iframe>
  </div>

  <script>
    /* DARK MODE LOGIC */
    const themeSwitch = document.getElementById("themeSwitch");

    function applyTheme(mode) {
      if (mode === "dark") {
        document.body.classList.add("dark");
        themeSwitch.classList.add("active");
      } else {
        document.body.classList.remove("dark");
        themeSwitch.classList.remove("active");
      }
      localStorage.setItem("jc_theme", mode);
    }

    applyTheme(localStorage.getItem("jc_theme") || "light");

    themeSwitch.onclick = () => {
      const newTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(newTheme);
    };
  </script>

</body>
</html>
