<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>JC Browser</title>

  <style>
    /* THEME VARIABLES */
    :root {
      --bg: #ffffff;
      --surface: #f2f2f2;
      --text: #000000;
      --accent: #0a84ff;
      --tab-bg: #eee;
      --tab-active: #dfefff;
      --border: #ccc;
    }

    .dark {
      --bg: #000000;
      --surface: #111111;
      --text: #ffffff;
      --accent: #1f6bff;
      --tab-bg: #1a1a1a;
      --tab-active: #333333;
      --border: #333333;
    }

    html, body { height: 100%; }
    body {
      font-family: system-ui, Arial;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    #controls { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
    #tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }

    .tab {
      padding:6px 10px;
      background: var(--tab-bg);
      border-radius:6px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--text);
    }

    .tab.active {
      background: var(--tab-active);
      font-weight:600;
    }

    .close { color:#900; cursor:pointer; padding-left:6px; }

    .new-tab-btn {
      padding:6px 10px;
      background: var(--accent);
      color:white;
      border-radius:6px;
      cursor:pointer;
    }

    #iframeContainer {
      border:1px solid var(--border);
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: var(--surface);
    }

    #iframeContainer iframe {
      width:100%;
      height:100%;
      border:0;
      display:block;
    }

    input[type="text"] {
      flex:1;
      padding:6px 8px;
      border-radius:6px;
      border:1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    button {
      padding:6px 8px;
      border-radius:6px;
      background: var(--surface);
      color: var(--text);
      border:1px solid var(--border);
      cursor:pointer;
    }

    /* DARK MODE SWITCH */
    .switch {
      position: relative;
      width: 50px;
      height: 26px;
      background: #555;
      border-radius: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: 0.25s;
    }

    .switch.active {
      background: var(--accent);
    }

    .switch.active::after {
      left: 26px;
    }
  </style>
</head>

<body>
  <div id="controls">
    <button id="backBtn">◀</button>
    <button id="forwardBtn">▶</button>
    <button id="reloadBtn">⟳</button>
    <input id="urlInput" type="text" placeholder="Enter URL (example: example.com)" />
    <button id="openBtn">Open</button>
    <button id="newTabBtn">New Tab</button>

    <!-- DARK MODE SWITCH -->
    <div id="themeSwitch" class="switch"></div>
  </div>

  <div id="tabs"></div>

  <div id="iframeContainer">
    <p style="text-align:center;margin-top:20px;">
      Welcome to the Jc Unblocked Browser Enter a URL to start browsing. This unblocked web browser is brought to you by
      <a href="https://sites.google.com/view/jcunblockedio" target="_blank">JC Unblocked</a>
    </p>
  </div>

  <script>
    /* ---------------------- DARK MODE LOGIC ---------------------- */

    const themeSwitch = document.getElementById("themeSwitch");

    function applyTheme(mode) {
      if (mode === "dark") {
        document.body.classList.add("dark");
        themeSwitch.classList.add("active");
      } else {
        document.body.classList.remove("dark");
        themeSwitch.classList.remove("active");
      }
      localStorage.setItem("jc_theme", mode);
    }

    const savedTheme = localStorage.getItem("jc_theme") || "light";
    applyTheme(savedTheme);

    themeSwitch.onclick = () => {
      const newTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(newTheme);
    };

    /* ---------------------- ORIGINAL BROWSER CODE ---------------------- */

    let tabs = [];
    let activeTab = -1;

    function ensureHttps(url) {
      url = url.trim();
      if (!url) return url;
      const lower = url.toLowerCase();

      /* FIXED: removed lcc-games ONLY */
      if (lower.includes('jc unblocked')) {
        return 'https://sites.google.com/view/jcunblockedio';
      }

      if (!lower.startsWith('http://') && !lower.startsWith('https://')) {
        url = 'https://' + url;
      }
      return url;
    }

    function createTab(url = '') {
      tabs.push({ url: url, history: [], historyIndex: -1 });
      activeTab = tabs.length - 1;
      renderTabs();
      switchTab(activeTab);
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';
      tabs.forEach((tab, index) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'tab' + (index === activeTab ? ' active' : '');
        tabEl.innerHTML = `Tab ${index + 1} <span class="close" data-index="${index}">×</span>`;
        tabEl.onclick = () => switchTab(index);
        tabsContainer.appendChild(tabEl);

        const closeBtn = tabEl.querySelector('.close');
        closeBtn.addEventListener('click', (e) => { e.stopPropagation(); closeTab(index); });
      });

      const newTabBtn = document.createElement('div');
      newTabBtn.className = 'new-tab-btn';
      newTabBtn.textContent = '+';
      newTabBtn.onclick = newTab;
      tabsContainer.appendChild(newTabBtn);
    }

    function switchTab(index) {
      if (index < 0 || index >= tabs.length) return;
      activeTab = index;
      renderTabs();
      const tab = tabs[index];
      const iframeContainer = document.getElementById('iframeContainer');

      if (!tab.url) {
        iframeContainer.innerHTML = `<p style="text-align:center;margin-top:20px;">
            Enter a URL to start browsing. brought to you by
            <a href="https://sites.google.com/view/jcunblockedio" target="_blank">JC Unblocked</a>
          </p>`;
      } else {
        let encoded;
        try {
          encoded = btoa(tab.url);
        } catch (err) {
          encoded = btoa(unescape(encodeURIComponent(tab.url)));
        }

        const finalURL = `utopiaweb.org
${encodeURIComponent(encoded)}`;

        iframeContainer.innerHTML = `<iframe src="${finalURL}" allowfullscreen></iframe>`;
      }

      document.getElementById('urlInput').value = tab.url || '';
    }

    function openTab() {
      if (activeTab === -1) { createTab(); return; }
      let inputURL = document.getElementById('urlInput').value;
      inputURL = ensureHttps(inputURL);
      const tab = tabs[activeTab];
      tab.url = inputURL;
      tab.history = tab.history.slice(0, tab.historyIndex + 1);
      tab.history.push(inputURL);
      tab.historyIndex++;
      switchTab(activeTab);
    }

    function newTab() { createTab(); }

    function closeTab(index) {
      if (index < 0 || index >= tabs.length) return;
      tabs.splice(index, 1);
      if (tabs.length === 0) {
        activeTab = -1;
        document.getElementById('iframeContainer').innerHTML = '';
      } else {
        if (activeTab >= tabs.length) activeTab = tabs.length - 1;
        switchTab(activeTab);
      }
      renderTabs();
    }

    function goBack() {
      if (activeTab === -1) return;
      const tab = tabs[activeTab];
      if (tab && tab.historyIndex > 0) {
        tab.historyIndex--;
        tab.url = tab.history[tab.historyIndex];
        switchTab(activeTab);
      }
    }

    function goForward() {
      if (activeTab === -1) return;
      const tab = tabs[activeTab];
      if (tab && tab.historyIndex < tab.history.length - 1) {
        tab.historyIndex++;
        tab.url = tab.history[tab.historyIndex];
        switchTab(activeTab);
      }
    }

    function reloadTab() {
      if (activeTab !== -1) switchTab(activeTab);
    }

    document.getElementById('openBtn').addEventListener('click', openTab);
    document.getElementById('newTabBtn').addEventListener('click', newTab);
    document.getElementById('backBtn').addEventListener('click', goBack);
    document.getElementById('forwardBtn').addEventListener('click', goForward);
    document.getElementById('reloadBtn').addEventListener('click', reloadTab);

    createTab();
  </script>
</body>
</html>
