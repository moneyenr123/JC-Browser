<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>JC Browser</title>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #f2f2f2;
      --text: #000000;
      --accent: #0a84ff;
      --tab-bg: #eee;
      --tab-active: #dfefff;
      --border: #ccc;
    }

    .dark {
      --bg: #000000;
      --surface: #111111;
      --text: #ffffff;
      --accent: #1f6bff;
      --tab-bg: #1a1a1a;
      --tab-active: #333333;
      --border: #333333;
    }

    html, body { height: 100%; }
    body {
      font-family: system-ui, Arial;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
    }

    #controls { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
    #tabs { display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }

    .tab {
      padding:6px 10px;
      background: var(--tab-bg);
      border-radius:6px;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      color: var(--text);
    }

    .tab.active {
      background: var(--tab-active);
      font-weight:600;
    }

    .close { color:#900; cursor:pointer; padding-left:6px; }

    .new-tab-btn {
      padding:6px 10px;
      background: var(--accent);
      color:white;
      border-radius:6px;
      cursor:pointer;
    }

    #iframeContainer {
      border:1px solid var(--border);
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      background: var(--surface);
    }

    #iframeContainer iframe {
      width:100%;
      height:100%;
      border:0;
      display:block;
    }

    /* DARK MODE SWITCH */
    .switch {
      position: relative;
      width: 50px;
      height: 26px;
      background: #555;
      border-radius: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .switch::after {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: 0.25s;
    }

    .switch.active {
      background: var(--accent);
    }

    .switch.active::after {
      left: 26px;
    }
  </style>
</head>

<body>
  <div id="controls">
    <button id="backBtn">◀</button>
    <button id="forwardBtn">▶</button>
    <button id="reloadBtn">⟳</button>
    <button id="newTabBtn">New Tab</button>
    <div id="themeSwitch" class="switch"></div>
  </div>

  <div id="tabs"></div>

  <div id="iframeContainer"></div>

  <script>
    /* ---------------------- DARK MODE ---------------------- */
    const themeSwitch = document.getElementById("themeSwitch");

    function applyTheme(mode) {
      if (mode === "dark") {
        document.body.classList.add("dark");
        themeSwitch.classList.add("active");
      } else {
        document.body.classList.remove("dark");
        themeSwitch.classList.remove("active");
      }
      localStorage.setItem("jc_theme", mode);
    }

    applyTheme(localStorage.getItem("jc_theme") || "light");

    themeSwitch.onclick = () => {
      const newTheme = document.body.classList.contains("dark") ? "light" : "dark";
      applyTheme(newTheme);
    };

    /* ---------------------- JC BROWSER ---------------------- */

    // SET YOUR PROXY HERE
    const PROXY_URL = "https://endis.rest";  
    // You can replace with:
    // const PROXY_URL = "https://your-rammerhead.herokuapp.com";
    // const PROXY_URL = "https://your-roxy.herokuapp.com";

    let tabs = [];
    let activeTab = -1;

    function createTab() {
      tabs.push({});
      activeTab = tabs.length - 1;
      renderTabs();
      switchTab(activeTab);
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';

      tabs.forEach((tab, index) => {
        const tabEl = document.createElement('div');
        tabEl.className = 'tab' + (index === activeTab ? ' active' : '');
        tabEl.innerHTML = `Tab ${index + 1} <span class="close" data-index="${index}">×</span>`;
        tabEl.onclick = () => switchTab(index);
        tabsContainer.appendChild(tabEl);

        tabEl.querySelector('.close').onclick = (e) => {
          e.stopPropagation();
          closeTab(index);
        };
      });

      const newTabBtn = document.createElement('div');
      newTabBtn.className = 'new-tab-btn';
      newTabBtn.textContent = '+';
      newTabBtn.onclick = createTab;
      tabsContainer.appendChild(newTabBtn);
    }

    function switchTab(index) {
      if (index < 0 || index >= tabs.length) return;
      activeTab = index;
      renderTabs();

      document.getElementById('iframeContainer').innerHTML =
        `<iframe src="${PROXY_URL}" allowfullscreen></iframe>`;
    }

    function closeTab(index) {
      tabs.splice(index, 1);
      if (tabs.length === 0) {
        activeTab = -1;
        document.getElementById('iframeContainer').innerHTML = '';
      } else {
        if (activeTab >= tabs.length) activeTab = tabs.length - 1;
        switchTab(activeTab);
      }
      renderTabs();
    }

    document.getElementById('backBtn').onclick = () => {
      const iframe = document.querySelector("#iframeContainer iframe");
      if (iframe) iframe.contentWindow.history.back();
    };

    document.getElementById('forwardBtn').onclick = () => {
      const iframe = document.querySelector("#iframeContainer iframe");
      if (iframe) iframe.contentWindow.history.forward();
    };

    document.getElementById('reloadBtn').onclick = () => {
      const iframe = document.querySelector("#iframeContainer iframe");
      if (iframe) iframe.contentWindow.location.reload();
    };

    document.getElementById('newTabBtn').onclick = createTab;

    createTab();
  </script>
</body>
</html>
